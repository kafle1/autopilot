<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autopilot</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d14">
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f7; --text:#101322; --dim:#5f687d; --faint:#8a92a6; --border:#e3e6ee;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef0ff; --on-accent:#ffffff;
  --ok:#15803d; --ok-bg:#e6f6ec; --bad:#dc2626; --bad-bg:#fdecec; --warn:#b45309; --warn-bg:#fdf3e1;
  --info:#2563eb; --info-bg:#e8f0fe; --gray:#667085; --gray-bg:#eceef3; --purple:#7c3aed; --purple-bg:#f1ecfe;
  --shadow:0 1px 2px rgba(16,19,34,.04),0 4px 14px rgba(16,19,34,.05);
  --shadow-hover:0 2px 4px rgba(16,19,34,.06),0 12px 30px rgba(16,19,34,.1);
  --log-bg:#0f1220; --log-text:#d8dcea;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0d14; --surface:#141722; --surface-2:#1b1f2c; --text:#e9ebf3; --dim:#a0a7b8; --faint:#737b90; --border:#252a38;
    --accent:#8b8ffc; --accent-hover:#a3a6ff; --accent-soft:#1e2143; --on-accent:#0b0d14;
    --ok:#4ade80; --ok-bg:#12291b; --bad:#f87171; --bad-bg:#341618; --warn:#fbbf24; --warn-bg:#33260c;
    --info:#60a5fa; --info-bg:#132640; --gray:#9aa1b3; --gray-bg:#212533; --purple:#c4b5fd; --purple-bg:#271f45;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-hover:0 8px 28px rgba(0,0,0,.45);
    --log-bg:#080a10;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
h1,h2,h3,p{margin:0;}
h1,h2{letter-spacing:-.015em;}
a{color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.hidden{display:none !important;}
.invisible{visibility:hidden;}

#topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border);}
.brand{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--text);text-decoration:none;font-weight:650;font-size:16px;}
.brand img{width:26px;height:26px;border-radius:7px;flex:none;}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.iconbtn{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:none;border-radius:10px;color:var(--dim);cursor:pointer;}
.iconbtn:hover{background:var(--surface-2);color:var(--text);}
.iconbtn:disabled{opacity:.3;cursor:default;background:none;}
.offline-banner{background:var(--warn-bg);color:var(--warn);padding:10px 16px;text-align:center;font-size:14px;font-weight:550;}
#app{max-width:1080px;margin:0 auto;padding:28px 20px 90px;}
.narrow{max-width:760px;margin:0 auto;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;font-weight:550;z-index:50;}
.toast-error{background:var(--bad);color:#fff;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;}
.btn:hover{background:var(--surface-2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn-danger{color:var(--bad);}
.btn-danger:hover{background:var(--bad-bg);border-color:var(--bad);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--dim);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:9px;}
.btn-lg{min-height:52px;font-size:16px;border-radius:13px;}
.btn-block{width:100%;}
.action-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.spacer{flex:1;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);}
.section{margin-top:16px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.section h2{font-size:16px;font-weight:650;}
.section-sub{color:var(--dim);font-size:14px;margin:-6px 0 14px;}
.muted{color:var(--dim);font-size:14px;}
.error-text{color:var(--bad);font-size:13.5px;margin-top:8px;}
.saved-note{color:var(--ok);font-size:13.5px;font-weight:600;}
.notice{background:var(--warn-bg);color:var(--warn);border:1px solid transparent;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:550;margin-bottom:12px;}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;flex:none;background:var(--gray-bg);color:var(--gray);}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
.pill.live::before{animation:pulse 1.4s ease-in-out infinite;}
.pill-running{background:var(--info-bg);color:var(--info);}
.pill-ok{background:var(--ok-bg);color:var(--ok);}
.pill-failed{background:var(--bad-bg);color:var(--bad);}
.pill-broken{background:var(--warn-bg);color:var(--warn);}
.pill-building,.pill-fixing{background:var(--purple-bg);color:var(--purple);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.home-head h1{font-size:28px;font-weight:750;overflow-wrap:anywhere;}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;color:var(--dim);font-size:14px;}
.stat{display:inline-flex;align-items:center;gap:7px;}
.stat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gray);}
.stat-ok::before{background:var(--ok);}
.stat-live::before{background:var(--info);}
.stat-bad::before{background:var(--bad);}
.stat b{color:var(--text);font-weight:650;}
.home-actions{display:flex;gap:8px;flex-wrap:wrap;}
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:14px;}
.job-card{display:flex;flex-direction:column;gap:8px;padding:18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.job-card:hover{box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--accent) 35%,var(--border));}
.job-card.is-bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--border));}
.job-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.job-name{font-weight:650;font-size:16px;color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.job-about{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
.job-about.empty{color:var(--faint);font-style:italic;}
.job-meta{font-size:13px;color:var(--dim);}
.job-last{font-size:13px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
.job-error{font-size:13px;color:var(--bad);background:var(--bad-bg);padding:8px 10px;border-radius:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
.job-card .action-row{margin-top:auto;padding-top:6px;}
.empty-state{text-align:center;padding:52px 20px;}
.empty-state img{width:60px;height:60px;border-radius:16px;margin-bottom:14px;}
.empty-state h2{font-size:20px;margin-bottom:6px;}
.empty-state p{color:var(--dim);margin-bottom:20px;}

.hero-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.hero h1{font-size:25px;font-weight:750;overflow-wrap:anywhere;}
.hero-about{margin-top:6px;font-size:16px;color:var(--dim);}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px;margin-top:18px;}
.meta-item{background:var(--surface-2);border-radius:12px;padding:10px 14px;min-width:0;}
.meta-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650;}
.meta-value{font-size:14.5px;font-weight:600;margin-top:2px;overflow-wrap:anywhere;}
.summary-box,.error-box{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;}
.summary-box{background:var(--accent-soft);}
.asked-item+.asked-item{margin-top:14px;}
.asked-when{font-size:12.5px;color:var(--faint);margin-bottom:4px;}
.asked-text{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;}
.notice .btn{margin-top:10px;}
.error-box{background:var(--bad-bg);color:var(--bad);}
.hero .action-row{margin-top:18px;}
.delete-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;padding:12px;border-radius:12px;background:var(--bad-bg);}
.delete-confirm .input{flex:1;min-width:150px;}

.logbox{background:var(--log-bg);color:var(--log-text);border-radius:12px;padding:14px 16px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:60vh;min-height:140px;overflow:auto;margin:0;}
.run-select{min-height:36px;max-width:100%;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;}
.fold{padding:0;}
.fold > summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:650;font-size:16px;}
.fold > summary::-webkit-details-marker{display:none;}
.fold > summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);transition:transform .15s;margin:0 4px 4px 0;}
.fold[open] > summary::after{transform:rotate(-135deg);margin:4px 4px 0 0;}
.fold-body{padding:0 20px 20px;}
.count{color:var(--faint);font-weight:500;}

.input,.textarea-mono{width:100%;border:1px solid var(--border);border-radius:11px;background:var(--surface);padding:10px 12px;font-size:15px;transition:border-color .15s,box-shadow .15s;}
.input{min-height:44px;}
.input:focus,.textarea-mono:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.textarea-mono{display:block;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;}
.file-list{display:flex;flex-direction:column;gap:6px;}
.file-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;font-size:14px;}
.file-row:hover{background:var(--surface-2);}
.file-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-size{color:var(--faint);flex:none;font-size:12.5px;}
.file-editor{margin-top:12px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);}
.file-editor-title{font-weight:650;margin-bottom:8px;font-size:14px;overflow-wrap:anywhere;}
.row-buttons{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}

.composer{position:relative;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,background .15s;}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.composer.drag{border-color:var(--accent);border-style:dashed;background:var(--accent-soft);}
.composer-input{display:block;width:100%;border:none;outline:none;background:transparent;resize:vertical;padding:16px 18px 8px;font-size:16px;line-height:1.6;min-height:190px;max-height:60vh;field-sizing:content;}
.composer-sm .composer-input{min-height:110px;}
.composer-input::placeholder{color:var(--faint);}
.composer-bar{display:flex;align-items:center;gap:10px;padding:8px 10px 10px 10px;flex-wrap:wrap;}
.composer-hint{flex:1;min-width:0;color:var(--faint);font-size:13px;}
.attach-list{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 0;}
.attach-list:empty{display:none;}
.attach-item{display:flex;align-items:center;gap:9px;max-width:250px;padding:5px 4px 5px 5px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);font-size:13px;}
.attach-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;}
.attach-ext{display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:750;letter-spacing:.03em;}
.attach-info{display:flex;flex-direction:column;min-width:0;line-height:1.3;}
.attach-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550;}
.attach-size{color:var(--faint);font-size:12px;}
.attach-x{flex:none;width:28px;height:28px;border:none;border-radius:8px;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;}
.attach-x:hover{background:var(--bad-bg);color:var(--bad);}

.page-title{font-size:30px;font-weight:750;letter-spacing:-.02em;}
.page-sub{color:var(--dim);margin:6px 0 20px;font-size:15.5px;}
.field{margin-top:18px;}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;}
.field .optional{font-weight:400;color:var(--faint);}
.toggle{position:relative;display:flex;align-items:flex-start;gap:14px;margin-top:14px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;}
.toggle:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--border));}
.toggle input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
.switch{flex:none;position:relative;width:44px;height:26px;margin-top:1px;border-radius:999px;background:var(--gray-bg);border:1px solid var(--border);transition:background .15s,border-color .15s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s;}
.toggle input:checked + .switch{background:var(--accent);border-color:var(--accent);}
.toggle input:checked + .switch::after{transform:translateX(18px);}
.toggle input:focus-visible + .switch{outline:2px solid var(--accent);outline-offset:2px;}
.toggle-text{display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:600;}
.toggle-text small{color:var(--dim);font-size:13.5px;font-weight:400;}
.build-btn{margin-top:20px;}

.engine-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.engine-row{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
.engine-row.dim{opacity:.55;}
.engine-num{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:750;display:flex;align-items:center;justify-content:center;flex:none;}
.engine-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.engine-tag{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--gray-bg);color:var(--gray);flex:none;font-weight:650;}
.engine-tag.found{background:var(--ok-bg);color:var(--ok);}
.phone-code{font:700 34px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:10px;text-align:center;margin:16px 0 4px;}
.phone-url{overflow-wrap:anywhere;color:var(--accent);font-size:14px;display:block;margin:6px 0;}
.center{text-align:center;}
.signin-box{max-width:420px;margin:10vh auto 0;text-align:center;padding:32px 24px;}
.signin-box img{width:60px;height:60px;border-radius:16px;}
.signin-box h1{font-size:23px;margin:14px 0 6px;}
.code-input{text-align:center;letter-spacing:10px;font-size:26px;margin:20px 0 12px;font-variant-numeric:tabular-nums;}

@media (max-width: 560px){
  #app{padding:18px 16px 90px;}
  .home-head{margin-bottom:16px;}
  .home-head h1{font-size:24px;}
  .home-actions{width:100%;}
  .home-actions .btn{flex:1;}
  .card{padding:16px;}
  .fold > summary{padding:16px;}
  .fold-body{padding:0 16px 16px;}
  .page-title{font-size:24px;}
  .input,.run-select,.textarea-mono{font-size:16px;}
  .btn-sm{min-height:40px;}
  .composer-hint{display:none;}
  .hero .action-row .btn{flex:1 1 auto;}
}
</style>
</head>

<div id="topbar">
  <button id="back-btn" class="iconbtn invisible" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <a class="brand" href="#/"><img src="/icon.svg" alt=""><span id="topbar-title">Autopilot</span></a>
  <button id="gear-btn" class="iconbtn" aria-label="Settings"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>

<script>
"use strict";

var state = null;
var signedOut = false;
var logName = null, logBoxEl = null, logRunSelectEl = null, followingLatestLog = true, detailKey = null;
var extraTimers = [];
var openFolds = {};
var MAX_FILES = 20, MAX_BYTES = 25 * 1024 * 1024;

/* ---------- tiny DOM helper (never uses innerHTML) ---------- */
function el(tag, attrs) {
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === null || c === undefined) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}

/* ---------- formatting ---------- */
function fmtRelative(epoch) {
  if (epoch === null || epoch === undefined) return "";
  var diff = epoch - Date.now() / 1000;
  var abs = Math.abs(diff);
  var future = diff >= 0;
  if (abs < 45) return future ? "in a few sec" : "just now";

/* ---------- network ---------- */

/* ---------- routing ---------- */

/* ---------- sign in ---------- */

  var input = el("input", {type: "text", inputmode: "numeric", autocomplete: "one-time-code", maxlength: "6", class: "input code-input", placeholder: "123456"});

        thumb.addEventListener("error", function (lbl) { this.replaceWith(lbl); }.bind(thumb, label));
      }
      var x = el("button", {type: "button", class: "attach-x", "aria-label": "Remove " + (f.name || "file"), title: "Remove"}, "×");
      x.addEventListener("click", remove.bind(null, item));
      item.node = el("div", {class: "attach-item", title: f.name || ""}, thumb,
        el("div", {class: "attach-info"}, el("span", {class: "attach-name"}, f.name || "pasted file"), el("span", {class: "attach-size"}, formatSize(f.size))), x);
      items.push(item);
      list.appendChild(item.node);
    }
  }

  addBtn.addEventListener("click", function () { picker.click(); });
  picker.addEventListener("change", function () { add(picker.files); picker.value = ""; });
  box.addEventListener("paste", function (e) {
    var cd = e.clipboardData;
    if (!cd || !cd.files || !cd.files.length) return;
    if (!cd.getData("text/plain")) e.preventDefault();
    add(cd.files);
  });
  box.addEventListener("dragover", function (e) { if (!hasFiles(e)) return; e.preventDefault(); box.classList.add("drag"); });
  box.addEventListener("dragleave", function (e) { if (!box.contains(e.relatedTarget)) box.classList.remove("drag"); });
  box.addEventListener("drop", function (e) {
    box.classList.remove("drag");
    if (!hasFiles(e)) return;
    e.preventDefault();
    add(e.dataTransfer.files);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
  });

  return {
    el: box, bar: bar, input: input,
    text: function () { return input.value.trim(); },
    files: function () { return Promise.all(items.map(function (it) { return readFile(it.file); })); },
    clear: function () { input.value = ""; items.slice().forEach(remove); }
  };
}

function renderBuildSection(name) {
  var sec = el("div", {class: "card section"});
  sec.appendChild(el("div", {class: "section-head"}, el("h2", {}, "Change it with AI")));
  sec.appendChild(el("p", {class: "section-sub"}, "Say what to change in plain words. Add screenshots or files if they help explain it."));
  var sendBtn = el("button", {class: "btn btn-primary btn-sm"}, "Send");
  var c = composer("For example: also send me the result by email, and skip weekends", send, true);
  c.bar.appendChild(sendBtn);
  sendBtn.addEventListener("click", send);
  async function send() {
    var instruction = c.text();
    if (!instruction) { toast("Say what to change first", true); c.input.focus(); return; }
    if (sendBtn.disabled) return;
    sendBtn.disabled = true;
    try {
      var files = await c.files();
      await api("/api/build", {method: "POST", body: JSON.stringify({name: name, instruction: instruction, files: files})});
      c.clear();
      toast("Working on it. Watch the log above.");
      followingLatestLog = true;
      await refreshState();
      loadLog();
    } catch (err) { showError(err); }
    finally { sendBtn.disabled = false; }
  }
  sec.appendChild(c.el);
  return sec;
}

function fold(title, key, count, openAtFirst) {
  var d = el("details", {class: "card section fold"});
  d.open = key in openFolds ? openFolds[key] : !!openAtFirst;
  d.addEventListener("toggle", function () { openFolds[key] = d.open; });
  d.appendChild(el("summary", {}, el("span", {}, title, count === undefined ? null : el("span", {class: "count"}, "  " + count))));
  var body = el("div", {class: "fold-body"});
  d.appendChild(body);
  return {el: d, body: body};
}

function renderAskedSection(asked) {
  var f = fold("What you asked for", "asked", asked.length > 1 ? asked.length : undefined, true);
  asked.forEach(function (a, i) {
    var when = (i === 0 ? "First ask" : "Change") + (a.at ? ", " + fmtExact(a.at) : "");
    if (a.files && a.files.length) when += ", with " + a.files.join(", ");
    f.body.appendChild(el("div", {class: "asked-item"}, el("div", {class: "asked-when"}, when), el("div", {class: "asked-text"}, a.text)));
  });
  return f.el;
}

function renderFilesSection(name, files) {
  var f = fold("Files", "files", files && files.length ? files.length : undefined);
  if (!files || !files.length) {
    f.body.appendChild(el("div", {class: "muted"}, "No files yet."));
    return f.el;
  }
  var editorBox = el("div", {class: "file-editor hidden"});
  var list = el("div", {class: "file-list"});
  files.forEach(function (file) {
    var row = el("button", {class: "file-row"}, el("span", {class: "file-path"}, file.path), el("span", {class: "file-size"}, formatSize(file.size)));
    row.addEventListener("click", function () { openFile(name, file, editorBox); });
    list.appendChild(row);
  });
  f.body.appendChild(list);
  f.body.appendChild(editorBox);
  return f.el;
}
async function openFile(name, f, editorBox) {
  editorBox.textContent = "";
  editorBox.classList.remove("hidden");
  editorBox.appendChild(el("div", {class: "muted"}, "Loading " + f.path + "…"));
  try {
    var text = await api("/api/file?name=" + encodeURIComponent(name) + "&where=" + encodeURIComponent(f.where) + "&path=" + encodeURIComponent(f.path));
    editorBox.textContent = "";
    editorBox.appendChild(el("div", {class: "file-editor-title"}, f.path));
    var editable = /\.(md|txt|csv|json|toml)$/i.test(f.path);
    var ta = el("textarea", {class: "textarea-mono", rows: "14"});
    ta.value = typeof text === "string" ? text : "";
    ta.readOnly = !editable;
    editorBox.appendChild(ta);
    var row = el("div", {class: "row-buttons"});
    if (editable) {
      var saveBtn = el("button", {class: "btn btn-primary btn-sm"}, "Save");
      var note = el("span", {class: "saved-note hidden"}, "Saved");
      saveBtn.addEventListener("click", async function () {
        saveBtn.disabled = true;
        try {
          await api("/api/file", {method: "POST", body: JSON.stringify({name: name, where: f.where, path: f.path, text: ta.value})});
          note.classList.remove("hidden");
          setTimeout(function () { note.classList.add("hidden"); }, 2000);
        } catch (err) { showError(err); }
        finally { saveBtn.disabled = false; }
      });
      row.appendChild(saveBtn);
      row.appendChild(note);
    } else {
      row.appendChild(el("span", {class: "muted"}, "This file type can only be viewed here."));
    }
    var closeBtn = el("button", {class: "btn btn-ghost btn-sm"}, "Close");
    closeBtn.addEventListener("click", function () { editorBox.classList.add("hidden"); editorBox.textContent = ""; });
    row.appendChild(closeBtn);
    editorBox.appendChild(row);
  } catch (err) {
    editorBox.textContent = "";
    if (err.message !== "unauthorized") editorBox.appendChild(el("div", {class: "error-text"}, "Could not open file: " + err.message));
  }
}

function renderSettingsFileSection(name, text) {
  var f = fold("Settings file", "settings");
  f.body.appendChild(el("p", {class: "section-sub"}, "The file the AI wrote. Change it by hand only if you know what you are doing."));
  var ta = el("textarea", {class: "textarea-mono", rows: "16", spellcheck: "false"});
  ta.defaultValue = typeof text === "string" ? text : "";
  f.body.appendChild(ta);
  var row = el("div", {class: "row-buttons"});
  var saveBtn = el("button", {class: "btn btn-primary btn-sm"}, "Save");
  var note = el("span", {class: "saved-note hidden"}, "Saved");
  var errBox = el("div", {class: "error-text hidden"});
  saveBtn.addEventListener("click", async function () {
    saveBtn.disabled = true;
    errBox.classList.add("hidden");
    try {
      await api("/api/save", {method: "POST", body: JSON.stringify({name: name, text: ta.value})});
      ta.defaultValue = ta.value;
      note.classList.remove("hidden");
      setTimeout(function () { note.classList.add("hidden"); }, 2000);
      await refreshState();
    } catch (err) {
      if (err.message !== "unauthorized") { errBox.textContent = err.message; errBox.classList.remove("hidden"); }
    } finally { saveBtn.disabled = false; }
  });
  row.appendChild(saveBtn);
  row.appendChild(note);
  f.body.appendChild(row);
  f.body.appendChild(errBox);
  return f.el;
}

/* ---------- new autopilot ---------- */
function renderNewPage(root) {
  var page = el("div", {class: "narrow"});
  page.appendChild(el("h1", {class: "page-title"}, "What should it do?"));
  page.appendChild(el("p", {class: "page-sub"}, "Describe the job like you would to a helper: what to do, when, and how you want to hear about it. The AI on this computer builds it, tests it and switches it on."));

  var btn = el("button", {class: "btn btn-primary btn-lg btn-block build-btn"}, "Build it");
  var c = composer("Write as much detail as you like. Paste screenshots or add files that help explain it.", build);
  page.appendChild(c.el);

  var dash = el("input", {type: "checkbox"});
  page.appendChild(el("label", {class: "toggle"}, dash, el("span", {class: "switch"}),
    el("span", {class: "toggle-text"}, "It needs its own dashboard",
      el("small", {}, "A web page you can open to see what it found and control it. Leave this off for jobs that just run and send you a message."))));

  var nameInput = el("input", {type: "text", class: "input", placeholder: "Leave empty and one is picked for you", autocapitalize: "off", spellcheck: "false"});
  page.appendChild(el("div", {class: "field"}, el("label", {}, "Name ", el("span", {class: "optional"}, "(optional)")), nameInput));

  btn.addEventListener("click", build);
  async function build() {
    var instruction = c.text();
    if (!instruction) { toast("Describe what it should do first", true); c.input.focus(); return; }
    if (btn.disabled) return;
    var nm = nameInput.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
    btn.disabled = true;
    btn.textContent = "Starting…";
    try {
      var body = {instruction: instruction, files: await c.files(), dashboard: dash.checked};
      if (nm) body.new_name = nm;
      var data = await api("/api/build", {method: "POST", body: JSON.stringify(body)});
      c.clear();
      await refreshState();
      location.hash = "#/job/" + encodeURIComponent(data.name);
    } catch (err) { showError(err); }
    finally { btn.disabled = false; btn.textContent = "Build it"; }
  }
  page.appendChild(btn);
  root.appendChild(page);
  c.input.focus();
}

/* ---------- settings ---------- */
/* ---------- updates ---------- */
function updateButton(cls) {
  var btn = el("button", {class: cls}, "Update now");
  btn.addEventListener("click", async function () {
    btn.disabled = true;
    try {
      await api("/api/update", {method: "POST", body: JSON.stringify({})});
      toast("Updating. The page comes back in about a minute.");
      await refreshState();
    } catch (err) { showError(err); btn.disabled = false; }
  });
  return btn;
}
function updateNotice() {
  var d = state.device;
  if (d.updating) return el("div", {class: "notice"}, "Updating Autopilot now. This page comes back in about a minute.");
  if (!d.update) return null;
  var how = d.auto_update ? "It installs itself when nothing is running, or you can do it now." : "Automatic updates are off, so tap Update now to get it.";
  return el("div", {class: "notice"}, el("div", {}, "A new version of Autopilot is ready (" + d.update + "). " + how), updateButton("btn btn-sm btn-primary"));
}
function renderUpdatesSection() {
  var d = state.device;
  var sec = settingsCard("Updates", d.auto_update ? "Autopilot checks for a new version every few hours and installs it by itself when nothing is running."
    : "Autopilot checks for a new version every few hours. Automatic updates are off, because config.toml has auto_update = false.");
  sec.appendChild(el("p", {class: "muted"}, "This computer has version " + (d.version || "unknown") + "."));
  if (d.updating) sec.appendChild(el("p", {class: "muted"}, "Updating now. This page comes back in about a minute."));
  else if (d.update) {
    sec.appendChild(el("p", {class: "muted"}, "Version " + d.update + " is ready."));
    sec.appendChild(updateButton("btn btn-primary"));
  } else sec.appendChild(el("p", {class: "muted"}, "It is up to date."));
  return sec;
}

function renderSettingsPage(root) {
  var page = el("div", {class: "narrow"});
  page.appendChild(renderUpdatesSection());
  page.appendChild(renderEnginesSection());
  page.appendChild(renderPhoneSection());
  page.appendChild(renderAlertsSection());
  page.appendChild(renderHomeScreenHint());
  root.appendChild(page);
}
function settingsCard(title, sub) {
  var sec = el("div", {class: "card section"}, el("div", {class: "section-head"}, el("h2", {}, title)));
  if (sub) sec.appendChild(el("p", {class: "section-sub"}, sub));
  return sec;
}
function renderEnginesSection() {
  var sec = settingsCard("AI tools", "Autopilot uses the first one. If it fails or runs out, the next one takes over.");
  var found = state.engines.filter(function (e) { return e.found; }).map(function (e) { return e.name; });
  var notFound = state.engines.filter(function (e) { return !e.found; }).map(function (e) { return e.name; });
  var order = found.slice();
  var list = el("div", {class: "engine-list"});
  function draw() {
    list.textContent = "";
    order.forEach(function (name, i) {
      var row = el("div", {class: "engine-row"});
      row.appendChild(el("span", {class: "engine-num"}, String(i + 1)));
      row.appendChild(el("span", {class: "engine-name"}, name));
      row.appendChild(el("span", {class: "engine-tag found"}, "installed"));
      var upBtn = el("button", {class: "iconbtn", "aria-label": "Move up"}, "▲");
      upBtn.disabled = i === 0;
      upBtn.addEventListener("click", function () { var t = order[i - 1]; order[i - 1] = order[i]; order[i] = t; draw(); });
      var downBtn = el("button", {class: "iconbtn", "aria-label": "Move down"}, "▼");
      downBtn.disabled = i === order.length - 1;
      downBtn.addEventListener("click", function () { var t = order[i + 1]; order[i + 1] = order[i]; order[i] = t; draw(); });
      row.appendChild(upBtn);
      row.appendChild(downBtn);
      list.appendChild(row);
    });
    notFound.forEach(function (name) {
      var row = el("div", {class: "engine-row dim"});
      row.appendChild(el("span", {class: "engine-num"}, "·"));
      row.appendChild(el("span", {class: "engine-name"}, name));
      row.appendChild(el("span", {class: "engine-tag"}, "not installed"));
      list.appendChild(row);
    });
  }
  draw();
  sec.appendChild(list);
  var saveBtn = el("button", {class: "btn btn-primary"}, "Save order");
  saveBtn.addEventListener("click", async function () {
    saveBtn.disabled = true;
    try {
      await api("/api/engines", {method: "POST", body: JSON.stringify({order: order})});
      toast("Saved");
      await refreshState();
    } catch (err) { showError(err); }
    finally { saveBtn.disabled = false; }
  });
  sec.appendChild(saveBtn);
  return sec;
}
function renderPhoneSection() {
  var sec = settingsCard("Phone", "See and control everything from your phone.");
  var resultBox = el("div", {});
  var btn = el("button", {class: "btn btn-primary"}, "Add a phone");
  btn.addEventListener("click", async function () {
    btn.disabled = true;
    try {
      var data = await api("/api/pair/new", {method: "POST", body: JSON.stringify({})});
      resultBox.textContent = "";
      if (data.url) {
        resultBox.appendChild(el("p", {class: "muted", style: "margin-top:14px"}, "On your phone, open this address, then enter the code:"));
        resultBox.appendChild(el("span", {class: "phone-url"}, data.url));
      } else {
        resultBox.appendChild(el("p", {class: "muted", style: "margin-top:14px"}, "Phone access is off. On the computer run: autopilot phone"));
      }
      resultBox.appendChild(el("div", {class: "phone-code"}, data.code));
      var countdownEl = el("div", {class: "muted center"});
      resultBox.appendChild(countdownEl);
      var timer = setInterval(function () {
        var secs = Math.max(0, Math.round(data.expires - Date.now() / 1000));
        if (secs <= 0) { countdownEl.textContent = "Expired"; clearInterval(timer); return; }
        var m = Math.floor(secs / 60), s = secs % 60;
        countdownEl.textContent = "Expires in " + m + ":" + (s < 10 ? "0" : "") + s;
      }, 1000);
      extraTimers.push(timer);
    } catch (err) { showError(err); }
    finally { btn.disabled = false; }
  });
  sec.appendChild(btn);
  sec.appendChild(resultBox);
  return sec;
}
function renderAlertsSection() {
  var sec = settingsCard("Alerts");
  if (state.alerts && state.alerts.subscribe_url) {
    sec.appendChild(el("p", {class: "muted"}, "Install the free ntfy app and subscribe to this link:"));
    sec.appendChild(el("a", {href: state.alerts.subscribe_url, target: "_blank", rel: "noopener", class: "phone-url"}, state.alerts.subscribe_url));
  } else {
    sec.appendChild(el("p", {class: "muted"}, "Alerts are off. Run autopilot setup to turn them on."));
  }
  return sec;
}
function renderHomeScreenHint() {
  var sec = settingsCard("Add to home screen");
  sec.appendChild(el("p", {class: "muted"}, "iPhone: tap Share, then Add to Home Screen."));
  sec.appendChild(el("p", {class: "muted"}, "Android: open the menu, then Add to Home screen."));
  return sec;
}

/* ---------- polling ---------- */
function tick5() {
  if (signedOut) return;
  var r = parseRoute();
  if (r.page === "home" || r.page === "job") refreshState();
}
function tick3() {
  if (signedOut) return;
  var r = parseRoute();
  if (r.page !== "job" || !state) return;
  var job = state.jobs.find(function (j) { return j.name === r.name; });
  if (job && (job.status === "running" || job.building) && followingLatestLog) loadLog();
}

/* ---------- boot ---------- */
document.getElementById("back-btn").addEventListener("click", function () {
  if (history.length > 1) history.back(); else location.hash = "#/";
});
document.getElementById("gear-btn").addEventListener("click", function () { location.hash = "#/settings"; });
window.addEventListener("hashchange", function () {
  extraTimers.forEach(clearInterval);
  extraTimers = [];
  followingLatestLog = true;
  render();
  window.scrollTo(0, 0);
});
// a file dropped next to the box must not replace the whole page
window.addEventListener("dragover", function (e) { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("drop", function (e) { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("focus", function () { if (!signedOut) refreshState(); });
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && !signedOut) refreshState(); });
setInterval(tick5, 5000);
setInterval(tick3, 3000);

(async function boot() {
  render();
  try { state = await api("/api/state"); pageVersion = state.device.version; } catch (e) {}
  render();
})();
</script>
